<div *ngIf="pokemon as p" class="max-w-2xl w-full mx-auto p-8 bg-gray-800/40 backdrop-blur-md border border-gray-700 rounded-3xl shadow-2xl transition-all duration-300 hover:border-blue-500/50">
  
  <div class="flex justify-between items-start mb-6">
    <a routerLink="/pokemon" class="flex items-center text-gray-400 hover:text-blue-400 transition-colors font-medium">
      <span class="mr-2">←</span> Retour
    </a>

    <button 
      (click)="toggleFavorite(p)" 
      class="p-3 rounded-full bg-gray-900/50 border border-gray-700 hover:scale-110 transition-all active:scale-90 group">
      <span [class]="isFavorite(p.id) ? 'text-red-500' : 'text-gray-500 group-hover:text-red-400'" class="text-2xl">
        {{ isFavorite(p.id) ? '❤️' : '🤍' }}
      </span>
    </button>
  </div>

  <h1 class="text-4xl font-black mb-8 capitalize text-center text-white tracking-wider drop-shadow-[0_2px_10px_rgba(59,130,246,0.5)]">
    {{ p.name }}
  </h1>

  <div class="relative flex justify-center mb-8">
    <div class="absolute inset-0 bg-blue-500/10 blur-3xl rounded-full"></div>
    <img
      [src]="p.sprites.other['official-artwork'].front_default"
      [alt]="p.name"
      class="relative w-56 h-56 sm:w-64 sm:h-64 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] z-10"
    />
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="bg-black/30 p-4 rounded-2xl border border-gray-700/50">
      <span class="text-blue-400 text-xs font-bold uppercase block mb-1">Types</span>
      <span class="text-gray-200">{{ typesText }}</span>
    </div>
    <div class="bg-black/30 p-4 rounded-2xl border border-gray-700/50">
      <span class="text-blue-400 text-xs font-bold uppercase block mb-1">Dimensions</span>
      <span class="text-gray-200">{{ p.height / 10 }}m • {{ p.weight / 10 }}kg</span>
    </div>
    <div class="col-span-2 bg-black/30 p-4 rounded-2xl border border-gray-700/50">
      <span class="text-blue-400 text-xs font-bold uppercase block mb-1">Capacités</span>
      <span class="text-gray-200">{{ abilitiesText }}</span>
    </div>
  </div>
</div>

<div *ngIf="stats.length > 0" class="mt-8 p-8 bg-gray-800/40 backdrop-blur-md border border-gray-700 rounded-3xl shadow-2xl max-w-2xl w-full mx-auto">
  <h2 class="text-2xl font-bold mb-8 text-white flex items-center justify-center gap-3">
    <span class="text-blue-500">📊</span> Statistiques de combat
  </h2>

  <div *ngFor="let s of stats" class="mb-5">
    <div class="flex justify-between mb-2 text-sm font-bold">
      <span class="capitalize text-gray-400">{{ s.name }}</span>
      <span class="text-blue-400">{{ s.value }}</span>
    </div>
    <div class="w-full bg-black/40 h-3 rounded-full border border-gray-700 overflow-hidden">
      <div
        class="bg-gradient-to-r from-blue-600 via-blue-400 to-cyan-400 h-full rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(59,130,246,0.5)]"
        [style.width.%]="s.percentage"
      ></div>
    </div>
  </div>
</div>
