<h2 class="text-2xl font-bold mb-6 text-center">
  Liste des Pokémon
</h2>

<ul
  class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"
>
  <li
    *ngFor="let p of pokemons"
    class="flex flex-col items-center p-4 bg-white rounded-xl shadow hover:shadow-lg transition"
  >
    <a
      [routerLink]="['/pokemon', getPokemonId(p.url)]"
      class="flex flex-col items-center"
    >
      <!-- Image Pokémon -->
      <img
        [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' 
                + getPokemonId(p.url) + '.png'"
        [alt]="p.name"
        class="w-20 h-20 mx-auto mb-2"
      />

      <!-- Nom Pokémon -->
      <span class="capitalize font-semibold text-gray-800">
        {{ p.name }}
      </span>
    </a>
  </li>
</ul>

<p class="text-center mt-4 text-gray-600">
  {{ pokemons.length }} Pokémon chargés
</p>
