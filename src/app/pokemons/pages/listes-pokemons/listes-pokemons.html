<section class="max-w-6xl mx-auto px-4 py-10">

  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold text-white mb-2 drop-shadow-md">
      ⚡ Explorez les Pokémon
    </h2>
    <p class="text-gray-400 text-lg">
      Cliquez sur un Pokémon pour découvrir ses caractéristiques.
    </p>
  </div>

  <div *ngIf="isLoading" class="text-center py-10">
    <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
    <p class="text-gray-400 italic">Attrapage des Pokémon en cours...</p>
  </div>

  <div
    *ngIf="!isLoading"
    class="grid grid-cols-[repeat(auto-fill,minmax(160px,1fr))] gap-6"
  >
    <div
      *ngFor="let p of pokemons"
      [routerLink]="['/pokemon', getPokemonId(p.url)]"
      class="
        bg-gray-800/60 backdrop-blur-md text-white
        rounded-2xl p-5 text-center
        cursor-pointer
        border border-gray-700
        shadow-[0_4px_20px_rgba(0,0,0,0.3)]
        transition-all duration-300
        hover:border-blue-500 hover:bg-gray-700/80 hover:shadow-blue-900/40 hover:-translate-y-2
        active:scale-95
        group
      "
    >
      <div class="bg-gray-900/50 rounded-full p-2 mb-3 inline-block group-hover:bg-blue-900/30 transition-colors">
        <img
          [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' 
                + getPokemonId(p.url) + '.png'"
          [alt]="p.name"
          class="w-24 h-24 mx-auto drop-shadow-[0_5px_15px_rgba(255,255,255,0.1)] group-hover:scale-110 transition-transform duration-300"
        />
      </div>

      <h3 class="capitalize font-bold text-sm sm:text-lg tracking-wide group-hover:text-blue-400">
        {{ p.name }}
      </h3>
      
      <span class="text-[10px] font-mono text-gray-500 uppercase mt-2 block">
        #{{ getPokemonId(p.url).padStart(3, '0') }}
      </span>
    </div>
  </div>

  <div *ngIf="!isLoading" class="text-center mt-10">
    <span class="px-4 py-1 bg-gray-800 border border-gray-700 rounded-full text-xs text-gray-400">
      {{ pokemons.length }} Pokémon chargés
    </span>
  </div>

</section>
