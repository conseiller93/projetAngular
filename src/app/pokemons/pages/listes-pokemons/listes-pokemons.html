<section class="max-w-6xl mx-auto px-4 py-10">

  <!-- 🔹 Introduction -->
  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-2">
      ⚡ Explorez les Pokémon
    </h2>
    <p class="text-gray-600 text-lg">
      Cliquez sur un Pokémon pour découvrir ses caractéristiques.
    </p>
  </div>

  <!-- 🔄 Chargement -->
  <div *ngIf="isLoading" class="text-center py-10 text-gray-500">
    Chargement des Pokémon...
  </div>

  <!-- 🧩 Liste Pokémon -->
  <div
    *ngIf="!isLoading"
    class="grid grid-cols-[repeat(auto-fill,minmax(160px,1fr))] gap-5"
  >
    <div
      *ngFor="let p of pokemons"
      [routerLink]="['/pokemon', getPokemonId(p.url)]"
      class="
        bg-black/70 text-white
        rounded-xl p-4 text-center
        cursor-pointer
        shadow-md
        transition-all duration-300
        hover:bg-blue-600 hover:shadow-xl hover:-translate-y-1
        active:scale-95
      "
    >
      <!-- Image Pokémon -->
      <img
        [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'
              + getPokemonId(p.url) + '.png'"
        [alt]="p.name"
        class="w-20 h-20 mx-auto mb-3"
      />

      <!-- Nom -->
      <h3 class="capitalize font-semibold text-sm sm:text-base">
        {{ p.name }}
      </h3>
    </div>
  </div>

  <!-- Footer -->
  <p *ngIf="!isLoading" class="text-center mt-6 text-gray-500">
    {{ pokemons.length }} Pokémon chargés
  </p>

</section>
