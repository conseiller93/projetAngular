<section class="max-w-6xl mx-auto px-4 py-10">
  
  <div class="text-center mb-16">
    <h1 class="text-4xl font-black text-white mb-2 tracking-tight">MA COLLECTION ❤️</h1>
    <p class="text-gray-400 italic">Retrouvez ici tout ce que vous avez aimé.</p>
  </div>

  <div class="mb-16">
    <div class="flex items-center gap-4 mb-8">
      <h2 class="text-2xl font-bold text-blue-400 uppercase tracking-wider">⚡ Pokémon Favoris</h2>
      <div class="flex-grow h-px bg-gray-800"></div>
    </div>

    <div *ngIf="pokemonFavorites.length === 0" class="text-center py-10 bg-gray-800/10 rounded-3xl border border-dashed border-gray-700 text-gray-500">
      Aucun Pokémon dans vos favoris.
    </div>

    <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-6">
      <div *ngFor="let p of pokemonFavorites" 
           [routerLink]="['/pokemon', p.id]"
           class="relative bg-gray-800/40 backdrop-blur-md border border-gray-700 rounded-3xl p-5 text-center cursor-pointer group hover:border-blue-500/50 transition-all hover:-translate-y-2 shadow-xl">
        
        <button (click)="removePokemonFavorite(p.id, $event)" 
                class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-black/50 hover:bg-red-600 text-white rounded-full transition-colors z-20">
          ✕
        </button>

        <div class="bg-gray-900/50 rounded-full p-4 mb-4 inline-block group-hover:bg-blue-900/20 transition-colors">
          <img [src]="p.image" [alt]="p.name" class="w-20 h-20 object-contain drop-shadow-md group-hover:scale-110 transition-transform">
        </div>

        <h3 class="text-white font-bold capitalize text-lg group-hover:text-blue-400">
          {{ p.name }}
        </h3>
        <span class="text-[10px] font-mono text-gray-500">#{{ p.id }}</span>
      </div>
    </div>
  </div>

  <div class="mb-16">
    <div class="flex items-center gap-4 mb-8">
      <h2 class="text-2xl font-bold text-green-400 uppercase tracking-wider">🌍 Pays Favoris</h2>
      <div class="flex-grow h-px bg-gray-800"></div>
    </div>

    <div *ngIf="countryFavorites.length === 0" class="text-center py-10 bg-gray-800/10 rounded-3xl border border-dashed border-gray-700 text-gray-500">
      Aucun pays dans vos favoris.
    </div>

    <div class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-6">
      <div *ngFor="let c of countryFavorites" 
           [routerLink]="['/pays', c.name]"
           class="relative bg-gray-800/40 backdrop-blur-md border border-gray-700 rounded-3xl p-5 text-center cursor-pointer group hover:border-green-500/50 transition-all hover:-translate-y-2 shadow-xl">
        
        <button (click)="removeCountryFavorite(c.name, $event)" 
                class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-black/50 hover:bg-red-600 text-white rounded-full transition-colors z-20">
          ✕
        </button>

        <div class="mb-4 overflow-hidden rounded-lg shadow-lg">
          <img [src]="c.flag" [alt]="c.name" class="w-full h-24 object-cover group-hover:scale-110 transition-transform duration-500">
        </div>

        <h3 class="text-white font-bold capitalize text-lg group-hover:text-green-400">
          {{ c.name }}
        </h3>
        <p class="text-xs text-gray-500">🏛️ {{ c.capital }}</p>
      </div>
    </div>
  </div>

</section>
