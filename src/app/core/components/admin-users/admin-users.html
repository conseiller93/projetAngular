<div class="p-4 md:p-8 bg-white dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-200 transition-colors duration-300">
  <div class="max-w-6xl mx-auto">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-black text-gray-900 dark:text-white tracking-tight">Console d'Administration</h1>
        <p class="text-blue-600 dark:text-blue-400 text-sm font-medium mt-1 uppercase tracking-widest">Gestion de la base locale</p>
      </div>
      <div class="hidden lg:block h-px flex-grow mx-8 bg-gray-200 dark:bg-gray-800"></div>
    </div>

    <div class="bg-gray-50 dark:bg-gray-800/40 backdrop-blur-md p-6 md:p-8 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-xl dark:shadow-2xl mb-10">
      <h2 class="text-xs font-bold text-blue-600 dark:text-blue-400 mb-6 uppercase tracking-[0.2em]">✨ Créer un nouvel utilisateur</h2>
      <div class="flex flex-col md:flex-row gap-4 md:gap-6 items-stretch md:items-end">
        <div class="flex-grow">
          <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 mb-2 uppercase">Identifiant</label>
          <input type="text" [(ngModel)]="newUsername" placeholder="Ex: Momo"
            class="block w-full bg-white dark:bg-black/30 rounded-xl border-gray-300 dark:border-gray-700 p-3 border text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div class="flex-grow">
          <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 mb-2 uppercase">Mot de passe</label>
          <input type="password" [(ngModel)]="newPassword" placeholder="••••••••"
            class="block w-full bg-white dark:bg-black/30 rounded-xl border-gray-300 dark:border-gray-700 p-3 border text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <button (click)="onAddUser()" 
          class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20 transition-all active:scale-95 text-sm">
          Créer
        </button>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800/40 backdrop-blur-md shadow-xl dark:shadow-2xl rounded-3xl border border-gray-200 dark:border-gray-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
          <thead class="bg-gray-50 dark:bg-black/20 font-bold">
            <tr>
              <th class="px-4 md:px-6 py-5 text-left text-[10px] text-gray-500 dark:text-gray-400 uppercase tracking-widest">Utilisateur</th>
              <th class="px-4 md:px-6 py-5 text-left text-[10px] text-gray-500 dark:text-gray-400 uppercase tracking-widest">Rôle</th>
              <th class="px-4 md:px-6 py-5 text-left text-[10px] text-gray-500 dark:text-gray-400 uppercase tracking-widest font-bold">Statut</th>
              <th class="px-4 md:px-6 py-5 text-right text-[10px] text-gray-500 dark:text-gray-400 uppercase tracking-widest font-bold">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
            <tr *ngFor="let user of users" class="hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
              <td class="px-4 md:px-6 py-5 whitespace-nowrap">
                <div class="flex items-center">
                  <div class="h-8 w-8 md:h-10 md:w-10 rounded-full bg-blue-100 dark:bg-blue-600/20 border border-blue-200 dark:border-blue-500/30 flex items-center justify-center text-blue-600 dark:text-blue-400 font-black mr-3 md:mr-4">
                    {{ user.username[0] | uppercase }}
                  </div>
                  <span class="text-sm font-bold text-gray-900 dark:text-white">{{ user.username }}</span>
                </div>
              </td>
              <td class="px-4 md:px-6 py-5 whitespace-nowrap">
                <span [class]="user.role === 'ADMIN' ? 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 border-purple-200 dark:border-purple-500/30' : 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border-blue-200 dark:border-blue-500/30'"
                  class="px-2 md:px-3 py-1 rounded-lg text-[9px] font-black border uppercase tracking-wider">
                  {{ user.role }}
                </span>
              </td>
              <td class="px-4 md:px-6 py-5 whitespace-nowrap">
                <span [class]="user.isBlocked ? 'bg-red-100 dark:bg-red-900/20 text-red-700 dark:text-red-400 border-red-200 dark:border-red-500/30' : 'bg-green-100 dark:bg-green-900/20 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/30'"
                  class="px-2 md:px-3 py-1 rounded-full text-[9px] font-black border flex items-center w-fit uppercase">
                  <span class="h-1.5 w-1.5 rounded-full mr-1.5 animate-pulse" [class]="user.isBlocked ? 'bg-red-500' : 'bg-green-500'"></span>
                  {{ user.isBlocked ? 'Bloqué' : 'Actif' }}
                </span>
              </td>
              <td class="px-4 md:px-6 py-5 whitespace-nowrap text-right text-sm font-medium">
                <div class="flex justify-end gap-2">
                  <button (click)="onToggleBlock(user.id)" title="Bloquer/Débloquer"
                    class="p-2 bg-gray-100 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700">
                    {{ user.isBlocked ? '✅' : '🚫' }}
                  </button>
                  <button (click)="onResetPassword(user.id)" title="Reset Password"
                    class="p-2 bg-blue-50 dark:bg-blue-600/10 border border-blue-100 dark:border-blue-500/30 rounded-lg text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-600/20">
                    🔑
                  </button>
                  <button *ngIf="user.role !== 'ADMIN'" (click)="onDelete(user.id)" title="Supprimer"
                    class="p-2 bg-red-50 dark:bg-red-600/10 border border-red-100 dark:border-red-500/30 rounded-lg text-red-600 dark:text-red-500 hover:bg-red-600 hover:text-white">
                    🗑️
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
