<footer class="bg-gray-900 text-gray-300 mt-8">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">

      <!-- Date -->
      <p class="text-sm md:text-base">
        📅 {{ currentDate }}
      </p>

      <!-- Localisation -->
      <p class="text-sm md:text-base">
        📍 Localisation : {{ location }}
      </p>

      <!-- Contacts -->
      <div class="flex flex-col md:flex-row md:space-x-6 space-y-2 md:space-y-0 text-sm">
        
        <!-- Email -->
        <div class="flex items-center gap-1">
          📧
          <a href="mailto:{{ contacts.email }}" class="ml-1 text-blue-400 hover:text-blue-200 break-words">
            {{ contacts.email }}
          </a>
        </div>

        <!-- Téléphone -->
        <div class="flex items-center gap-1">
          📞
          <a href="tel:{{ contacts.phone }}" class="ml-1 text-blue-400 hover:text-blue-200">
            {{ contacts.phone }}
          </a>
        </div>

        <!-- LinkedIn -->
        <div class="flex items-center gap-1">
          💼 LinkedIn :
          <a href="{{ contacts.linkedin }}" target="_blank" class="ml-1 text-blue-400 hover:text-blue-200 break-words">
            Profil
          </a>
        </div>

      </div>

    </div>
  </div>
</footer>
