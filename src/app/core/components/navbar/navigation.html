<nav class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-extrabold tracking-tight hover:text-blue-200 transition-colors">
          Mamadou Djoulde Diallo
        </a>
      </div>

      <!-- Menu desktop -->
      <div class="hidden md:flex items-center space-x-6">
        <a routerLink="/" routerLinkActive="bg-blue-700" [routerLinkActiveOptions]="{ exact: true }"
          class="px-4 py-2 rounded-md hover:bg-blue-500 transition">
          Accueil
        </a>

        <a routerLink="/pays" routerLinkActive="bg-blue-700"
          class="px-4 py-2 rounded-md hover:bg-blue-500 transition">
          🌍 Pays
        </a>

        <a routerLink="/pokemon" routerLinkActive="bg-blue-700"
          class="px-4 py-2 rounded-md hover:bg-blue-500 transition">
          ⚡ Pokémon
        </a>

        <!-- 🔴 Déconnexion desktop -->
        <button
          (click)="logout()"
          class="ml-4 px-4 py-2 bg-red-500 rounded-md hover:bg-red-600 transition font-semibold"
        >
          Se déconnecter
        </button>
      </div>

      <!-- Hamburger mobile -->
      <div class="md:hidden">
        <button (click)="open = !open" class="p-2 rounded-md hover:bg-blue-500 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Menu mobile -->
  <div class="md:hidden" *ngIf="open">
    <a routerLink="/" class="block px-4 py-3 hover:bg-blue-500">Accueil</a>
    <a routerLink="/pays" class="block px-4 py-3 hover:bg-blue-500">🌍 Pays</a>
    <a routerLink="/pokemon" class="block px-4 py-3 hover:bg-blue-500">⚡ Pokémon</a>

    <!-- 🔴 Déconnexion mobile -->
    <button
      (click)="logout()"
      class="w-full text-left px-4 py-3 bg-red-500 hover:bg-red-600 transition"
    >
      Se déconnecter
    </button>
  </div>
</nav>
