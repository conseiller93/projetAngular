<div class="max-w-md w-full mx-auto mt-20 p-6 bg-white rounded-2xl shadow-lg">
  <h2 class="text-3xl font-bold mb-6 text-center">🔑 Connexion</h2>

  <form (ngSubmit)="login()" class="space-y-4">
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      required
    />

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Mot de passe"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      required
    />

    <button
  type="submit"
  [disabled]="isLoading"
  class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold p-3 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
>
  {{ isLoading ? 'Connexion...' : 'Se connecter' }}
</button>


    <p *ngIf="error" class="text-red-500 text-sm mt-2">{{ error }}</p>
  </form>
</div>
